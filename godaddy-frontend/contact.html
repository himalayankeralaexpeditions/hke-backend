<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact – HKE</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/hke-polish.css">
</head><body>
<!-- Navbar -->

<section class="container my-5">
  <h2 class="section-title">Contact Us</h2>
  <div class="row">
    <div class="col-md-6">
      <form id="contactForm" novalidate>
        <div class="mb-3"><input id="contactName" name="name" class="form-control" placeholder="Name" required></div>
        <div class="mb-3"><input id="contactPhone" name="phone" class="form-control" placeholder="Phone" inputmode="numeric" maxlength="10" required></div>
        <div class="mb-3"><input id="contactEmail" name="email" type="email" class="form-control" placeholder="Email"></div>
        <div class="mb-3"><textarea id="contactMessage" name="message" class="form-control" rows="4" placeholder="Message" required></textarea></div>
        <div id="contactStatus" class="small mb-3" aria-live="polite"></div>
        <button id="contactSubmitBtn" class="btn btn-warning" type="submit">Send</button>
      </form>
    </div>
    <div class="col-md-6">
      <div class="ratio ratio-16x9"><iframe src="https://maps.google.com/maps?q=Kochi&t=&z=8&ie=UTF8&iwloc=&output=embed"></iframe></div>
    </div>
  </div>
</section>

<!-- Footer -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="scripts/common.js"></script>
<script src="scripts/contact.js?v=20260505_contact"></script>

<script src="scripts/hke-polish.js"></script>
</body></html>
