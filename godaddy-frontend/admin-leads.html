<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HKE – Admin Leads</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

<link rel="stylesheet" href="css/hke-polish.css">
</head>
<body class="bg-dark text-light">
<div class="container py-4">
  <h2 class="mb-3">Himalayan Kerala Expeditions – Leads</h2>

  <div class="card mb-3">
    <div class="card-body">
      <label class="form-label">Admin Key</label>
      <div class="input-group">
        <input type="password" id="adminKey" class="form-control" placeholder="Enter ADMIN_TOKEN from .env" />
        <button class="btn btn-warning" id="loadBtn">Load Leads</button>
      </div>
      <div class="form-text text-muted">Keep this page private.</div>
    </div>
  </div>

  <div id="leadTableWrap"></div>
</div>

<script>
document.getElementById("loadBtn").addEventListener("click", async () => {
  const key = document.getElementById("adminKey").value.trim();
  if (!key) return alert("Enter admin key");

  const res = await fetch(`http://localhost:4000/api/leads?token=${encodeURIComponent(key)}`);
  const data = await res.json();
  if (!data.ok) {
    alert(data.message || "Failed to load");
    return;
  }

  const items = data.items || [];
  const wrap = document.getElementById("leadTableWrap");
  if (!items.length) {
    wrap.innerHTML = "<div class='alert alert-info'>No leads yet.</div>";
    return;
  }

  const rows = items.map((l, i) => {
    const c = l.customer || {};
    const p = l.payload || {};
    const phoneDigits = (c.phone || "").replace(/\\D/g, "");
    const wa = phoneDigits ? `https://wa.me/91${phoneDigits}` : "";
    return `
      <tr>
        <td>${i+1}</td>
        <td>${c.name || ""}</td>
        <td>${c.email || ""}</td>
        <td>${c.phone || ""}</td>
        <td>${p.destination || ""}</td>
        <td>${p.startDate || ""}</td>
        <td>${p.days || ""}</td>
        <td>
          ${wa ? `<a href="${wa}" target="_blank" class="btn btn-sm btn-success">WhatsApp</a>` : ""}
        </td>
      </tr>
    `;
  }).join("");

  wrap.innerHTML = `
    <div class="card">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-dark table-striped mb-0">
            <thead>
              <tr>
                <th>#</th><th>Name</th><th>Email</th><th>Phone</th>
                <th>Destination</th><th>Start</th><th>Days</th><th>Action</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>
    </div>
  `;
});
</script>

<script src="scripts/hke-polish.js"></script>
</body>
</html>
