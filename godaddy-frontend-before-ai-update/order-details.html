<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Order Details | Himalayan Kerala Expeditions</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <style>
    :root{
      --bg0:#070A10;
      --bg1:#0B0F18;
      --panel:rgba(255,255,255,.06);
      --border:rgba(255,255,255,.12);
      --text:#EAEFF7;
      --muted:rgba(234,239,247,.72);
      --gold:#D9B25F;
      --gold2:#F0D08A;
      --shadow:0 18px 55px rgba(0,0,0,.45);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:'Inter',system-ui,sans-serif;
      color:var(--text);
      background:
        radial-gradient(900px 520px at 15% 10%, rgba(217,178,95,.10), transparent 60%),
        linear-gradient(180deg,var(--bg0),var(--bg1));
    }
    .container{
      width:min(1120px,92%);
      margin:0 auto;
      padding:28px 0 48px;
    }
    .top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
      flex-wrap:wrap;
      margin-bottom:22px;
    }
    h1{
      margin:0 0 8px;
      font-size:2rem;
      font-weight:800;
    }
    .sub{ color:var(--muted); }
    .top a{
      text-decoration:none;
      color:var(--text);
      border:1px solid var(--border);
      background:rgba(255,255,255,.06);
      border-radius:999px;
      padding:10px 14px;
      font-weight:700;
    }
    .grid{
      display:grid;
      grid-template-columns:1.1fr .9fr;
      gap:18px;
    }
    .card{
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:22px;
      padding:20px;
      box-shadow:var(--shadow);
      margin-bottom:16px;
    }
    .title{
      font-size:1.1rem;
      font-weight:800;
      margin-bottom:12px;
      color:var(--gold2);
    }
    .kv{
      display:grid;
      grid-template-columns:180px 1fr;
      gap:8px 14px;
      margin-bottom:8px;
    }
    .k{ color:var(--muted); font-weight:600; }
    .v{ font-weight:700; word-break:break-word; }
    .warn{
      margin-top:12px;
      padding:12px 14px;
      border-radius:14px;
      background:rgba(217,178,95,.10);
      border:1px solid rgba(217,178,95,.18);
      color:#ffe8b2;
      font-weight:700;
      line-height:1.6;
    }
    .danger{
      margin-top:12px;
      padding:12px 14px;
      border-radius:14px;
      background:rgba(255,80,80,.12);
      border:1px solid rgba(255,80,80,.22);
      color:#ffd7d7;
      font-weight:700;
      line-height:1.6;
    }
    .btns{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:14px;
    }
    .btn{
      border:none;
      cursor:pointer;
      padding:12px 16px;
      border-radius:14px;
      font-weight:800;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;
    }
    .btn-primary{
      background:linear-gradient(135deg,var(--gold),var(--gold2));
      color:#0b0f18;
    }
    .btn-ghost{
      background:rgba(255,255,255,.08);
      color:var(--text);
      border:1px solid var(--border);
    }
    .input{
      width:100%;
      padding:13px 14px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.08);
      color:#fff;
      outline:none;
      margin-top:8px;
    }
    .payment-item{
      padding:12px 0;
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    .payment-item:last-child{ border-bottom:none; }
    .msg{
      margin-bottom:14px;
      padding:12px 14px;
      border-radius:14px;
      display:none;
      font-weight:700;
    }
    .msg.ok{
      display:block;
      background:rgba(46,204,113,.12);
      border:1px solid rgba(46,204,113,.22);
      color:#d8ffe7;
    }
    .msg.err{
      display:block;
      background:rgba(255,80,80,.12);
      border:1px solid rgba(255,80,80,.22);
      color:#ffd2d2;
    }
    @media (max-width:900px){
      .grid{ grid-template-columns:1fr; }
      .kv{ grid-template-columns:1fr; gap:4px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top">
      <div>
        <h1>Order Details</h1>
        <div class="sub">Manage your booking, payments, and cancellation options.</div>
      </div>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <a href="my-orders.html">← Back to Orders</a>
        <a href="index.html">Home</a>
      </div>
    </div>

    <div id="msg" class="msg"></div>

    <div class="grid">
      <div>
        <div class="card">
          <div class="title">Booking Information</div>
          <div id="bookingBox"></div>
          <div id="alertsBox"></div>
        </div>

        <div class="card">
          <div class="title">Payment Actions</div>
          <div id="paymentBox"></div>

          <div class="btns" id="actionBtns"></div>

          <div id="customWrap" style="margin-top:16px;">
            <label style="font-weight:700; color:#f5e4b8;">Custom Amount (₹)</label>
            <input id="customAmount" class="input" type="number" min="1000" step="100" placeholder="Enter custom amount">
            <div class="btns" style="margin-top:10px;">
              <button id="payCustomBtn" class="btn btn-primary" type="button">Pay Custom Amount</button>
            </div>
          </div>

          <div id="cancelWrap" style="margin-top:18px;">
            <label style="font-weight:700; color:#f5e4b8;">Cancellation Reason</label>
            <input id="cancelReason" class="input" type="text" placeholder="Optional reason">
            <div class="btns" style="margin-top:10px;">
              <button id="cancelBtn" class="btn btn-ghost" type="button">Cancel Booking</button>
            </div>
          </div>
        </div>
      </div>

      <div>
        <div class="card">
          <div class="title">Payment History</div>
          <div id="paymentsList"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function(){
      const API_BASE = "https://hke-backend.onrender.com";
      let currentOrder = null;

      const msgEl = document.getElementById("msg");
      const bookingBox = document.getElementById("bookingBox");
      const alertsBox = document.getElementById("alertsBox");
      const paymentBox = document.getElementById("paymentBox");
      const paymentsList = document.getElementById("paymentsList");
      const actionBtns = document.getElementById("actionBtns");

      function setMsg(text, isErr=false){
        msgEl.className = "msg " + (isErr ? "err" : "ok");
        msgEl.textContent = text;
      }

      function clearMsg(){
        msgEl.className = "msg";
        msgEl.textContent = "";
      }

      function esc(s){
        return String(s ?? "")
          .replaceAll("&","&amp;")
          .replaceAll("<","&lt;")
          .replaceAll(">","&gt;")
          .replaceAll('"',"&quot;")
          .replaceAll("'","&#039;");
      }

      function rupeeFromPaise(p){
        return "₹ " + (Number(p || 0) / 100).toLocaleString("en-IN");
      }

      async function getJSON(url){
        const res = await fetch(url);
        const txt = await res.text();
        let data = null;
        try { data = JSON.parse(txt); } catch { data = { raw: txt }; }
        if (!res.ok) throw new Error(data?.detail || data?.message || "Request failed");
        return data;
      }

      async function postJSON(url, body){
        const res = await fetch(url, {
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body: JSON.stringify(body)
        });

        const txt = await res.text();
        let data = null;
        try { data = JSON.parse(txt); } catch { data = { raw: txt }; }
        if (!res.ok) throw new Error(data?.detail || data?.message || "Request failed");
        return data;
      }

      function renderOrder(order){
        bookingBox.innerHTML = `
          <div class="kv"><div class="k">Booking ID</div><div class="v">${esc(order.booking_ref)}</div></div>
          <div class="kv"><div class="k">Customer</div><div class="v">${esc(order.customer_name || "-")}</div></div>
          <div class="kv"><div class="k">Phone</div><div class="v">${esc(order.phone || "-")}</div></div>
          <div class="kv"><div class="k">Email</div><div class="v">${esc(order.email || "-")}</div></div>
          <div class="kv"><div class="k">Destination</div><div class="v">${esc(order.destination || "-")}</div></div>
          <div class="kv"><div class="k">Travel Dates</div><div class="v">${esc(order.start_date || "-")} to ${esc(order.end_date || "-")}</div></div>
          <div class="kv"><div class="k">Booking Status</div><div class="v">${esc(order.booking_status || "-")}</div></div>
          <div class="kv"><div class="k">Payment Status</div><div class="v">${esc(order.payment_status || "-")}</div></div>
        `;

        paymentBox.innerHTML = `
          <div class="kv"><div class="k">Total Amount</div><div class="v">${rupeeFromPaise(order.total_amount_paise)}</div></div>
          <div class="kv"><div class="k">Paid Amount</div><div class="v">${rupeeFromPaise(order.paid_amount_paise)}</div></div>
          <div class="kv"><div class="k">Remaining Amount</div><div class="v">${rupeeFromPaise(order.remaining_amount_paise)}</div></div>
          <div class="kv"><div class="k">Full Payment Due</div><div class="v">${esc(order.full_payment_due_date || "-")}</div></div>
          <div class="kv"><div class="k">Cancel Until</div><div class="v">${esc(order.cancellable_until || "-")}</div></div>
        `;

        let alerts = "";
        if (Number(order.remaining_amount_paise || 0) > 0) {
          alerts += `<div class="warn">Remaining balance must be paid before <b>${esc(order.full_payment_due_date || "-")}</b>. Partial payments are allowed, but full payment is required before final confirmation.</div>`;
        }
        if (!order.can_cancel) {
          alerts += `<div class="danger">Online cancellation is not available now. Please contact support if your travel date is near.</div>`;
        }
        alertsBox.innerHTML = alerts;

        actionBtns.innerHTML = "";

        const remaining = Number(order.remaining_amount_paise || 0);
        const cancelled = String(order.booking_status || "") === "cancelled";

        if (!cancelled && remaining > 0) {
          const fullBtn = document.createElement("button");
          fullBtn.className = "btn btn-primary";
          fullBtn.textContent = "Pay Full Remaining";
          fullBtn.addEventListener("click", () => startBalancePayment("balance_full", remaining));
          actionBtns.appendChild(fullBtn);
        }

        document.getElementById("customWrap").style.display = (!cancelled && remaining > 0) ? "block" : "none";
        document.getElementById("cancelWrap").style.display = (!cancelled && order.can_cancel) ? "block" : "none";
      }

      function renderPayments(payments){
        if (!payments.length) {
          paymentsList.innerHTML = `<div style="color:rgba(234,239,247,.72); font-weight:600;">No payments found yet.</div>`;
          return;
        }

        paymentsList.innerHTML = payments.map(p => `
          <div class="payment-item">
            <div style="font-weight:800;">${esc(p.payment_type || "payment")} — ${rupeeFromPaise(p.amount_paise)}</div>
            <div style="color:rgba(234,239,247,.72); margin-top:4px;">Status: ${esc(p.status || "-")}</div>
            <div style="color:rgba(234,239,247,.72); margin-top:4px;">Payment ID: ${esc(p.razorpay_payment_id || "-")}</div>
            <div style="color:rgba(234,239,247,.72); margin-top:4px;">Date: ${esc(p.created_at || "-")}</div>
          </div>
        `).join("");
      }

      async function loadOrder(){
        const bookingRef = localStorage.getItem("HKE_SELECTED_BOOKING_REF") || "";
        if (!bookingRef) {
          setMsg("Booking reference not found. Please go back and open the order again.", true);
          return;
        }

        try{
          clearMsg();
          const data = await getJSON(`${API_BASE}/api/orders/${encodeURIComponent(bookingRef)}`);
          currentOrder = data.order;
          renderOrder(data.order);
          renderPayments(Array.isArray(data.payments) ? data.payments : []);
        }catch(err){
          setMsg(err.message || "Unable to load order details.", true);
        }
      }

      async function startBalancePayment(paymentType, amountPaise){
        if (!currentOrder) return;

        try{
          clearMsg();

          const resp = await postJSON(`${API_BASE}/api/payment/create-balance-order`, {
            booking_ref: currentOrder.booking_ref,
            amount_paise: amountPaise,
            payment_type: paymentType
          });

          const order = resp.order;
          const options = {
            key: resp.key,
            amount: order.amount,
            currency: order.currency,
            name: "Himalayan Kerala Expeditions",
            description: paymentType === "balance_full" ? "Full Remaining Payment" : "Custom Payment",
            order_id: order.id,
            prefill: {
              name: currentOrder.customer_name || "",
              email: currentOrder.email || "",
              contact: currentOrder.phone || ""
            },
            handler: async function (response) {
              try{
                await postJSON(`${API_BASE}/api/payment/verify-balance`, {
                  razorpay_order_id: response.razorpay_order_id,
                  razorpay_payment_id: response.razorpay_payment_id,
                  razorpay_signature: response.razorpay_signature
                });

                setMsg("Payment received successfully.");
                await loadOrder();
              }catch(err){
                setMsg(err.message || "Payment verification failed.", true);
              }
            },
            theme: { color: "#D9B25F" }
          };

          const rzp = new Razorpay(options);
          rzp.open();
        }catch(err){
          setMsg(err.message || "Unable to start payment.", true);
        }
      }

      document.getElementById("payCustomBtn").addEventListener("click", async () => {
        if (!currentOrder) return;

        const input = document.getElementById("customAmount");
        const value = Number(input.value || 0);

        if (!value || value < 1000) {
          setMsg("Minimum custom payment is ₹1,000.", true);
          return;
        }

        const amountPaise = Math.round(value * 100);
        const remaining = Number(currentOrder.remaining_amount_paise || 0);

        if (amountPaise > remaining) {
          setMsg("Custom amount cannot exceed remaining balance.", true);
          return;
        }

        await startBalancePayment("custom_partial", amountPaise);
      });

      document.getElementById("cancelBtn").addEventListener("click", async () => {
        if (!currentOrder) return;

        const reason = document.getElementById("cancelReason").value || "";

        try{
          await postJSON(`${API_BASE}/api/orders/cancel`, {
            booking_ref: currentOrder.booking_ref,
            reason
          });

          setMsg("Booking cancelled successfully.");
          await loadOrder();
        }catch(err){
          setMsg(err.message || "Unable to cancel booking.", true);
        }
      });

      loadOrder();
    })();
  </script>
</body>
</html>
